# JS Neurominds — Admin Gateway (Cloudflare Worker, free plan)
# Deploy:  npx wrangler login && npx wrangler deploy
# Secrets: npx wrangler secret put GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GITHUB_TOKEN / SESSION_SECRET
name = "jsnm-admin-gateway"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The Worker owns the admin hostname. (Remove admin.neurominds.in from the old Pages project first.)
routes = [
  { pattern = "admin.neurominds.in", custom_domain = true }
]

[vars]
GITHUB_REPO = "Chandrraagupthaareddey/js-neurominds-v1"
ADMIN_UI_ORIGIN = "https://neurominds.in/admin"
ALLOWED_ORIGINS = "https://admin.neurominds.in,https://neurominds.in"
SESSION_HOURS = "12"
# Roles — edit these lists to add/remove people (then `npx wrangler deploy`).
SUPER_ADMIN_EMAILS = "tcgr.8553665381@gmail.com"
ADMIN_EMAILS = "jsneurominds5@gmail.com,js@neurominds.in"
# Optional: comma-separated path prefixes only super admins may change.
# Default: content/settings/feature_flags.json, content/settings/seo.json, content/navigation.json, admin/, public-site/, scripts/, shared/
# SUPER_ADMIN_ONLY_PATHS = ""
