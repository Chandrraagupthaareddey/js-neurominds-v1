<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>JS Neurominds Admin</title>
    <link rel="icon" href="/assets/brand/favicon-32x32.png" sizes="32x32" type="image/png" />
    <meta name="theme-color" content="#0f6f6a" />
    <!-- Installable admin app (free): Share → Add to Home Screen on iPad/iPhone, "Install app" on Android/desktop Chrome -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JSNM Admin" />
    <link rel="apple-touch-icon" href="/assets/brand/admin-icon-192.png" />
    <meta name="description" content="Content editor for the JS Neurominds website (staff only)." />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://api.github.com" />
    <link rel="modulepreload" href="https://unpkg.com/@sveltia/cms@0.253.1/dist/sveltia-cms.js" />
    <!-- Absolute config path: works at /, /admin/ and any deep link such as /callback -->
    <link rel="cms-config-url" href="config.yml" id="cms-config-link" />
    <script>
      // Resolve config.yml next to THIS page (admin.neurominds.in/config.yml or neurominds.in/admin/config.yml), never relative to a deep path.
      (function(){ var base = location.pathname.indexOf("/admin/") === 0 ? "/admin/" : "/"; document.getElementById("cms-config-link").href = base + "config.yml"; })();
    </script>
    <style>
      :root { color-scheme: dark; }
      /* Branded sign-in screen shown in front of the CMS until the editor is ready. */
      #jsnm-login { position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(1200px 600px at 50% -10%, #12403c 0%, #0e1b2a 55%, #0a1420 100%); color: #e9eef5;
        font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; transition: opacity .25s ease; }
      #jsnm-login.is-hidden { opacity: 0; pointer-events: none; }
      #jsnm-login[hidden] { display: none; }
      .jl-card { width: min(420px, 100%); background: rgba(19, 33, 47, .92); border: 1px solid rgba(255,255,255,.08); border-radius: 20px;
        padding: 28px 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,.45); text-align: center; backdrop-filter: blur(10px); }
      .jl-logo { width: 160px; height: 160px; display: block; margin: 0 auto 14px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
      .jl-card h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; letter-spacing: -.01em; }
      .jl-card p { margin: 0 0 22px; color: #a9b7c6; font-size: 14px; }
      .jl-google { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 48px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,.14); background: #fff; color: #1f2937; font-weight: 600; font-size: 15px; cursor: pointer;
        transition: transform .12s ease, box-shadow .2s ease; }
      .jl-google:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
      .jl-google:disabled { opacity: .7; cursor: progress; transform: none; }
      .jl-google svg { width: 20px; height: 20px; flex: none; }
      .jl-status { min-height: 22px; margin-top: 14px; font-size: 13px; color: #a9b7c6; }
      .jl-status.is-error { color: #ffb4a8; }
      .jl-foot { margin-top: 22px; font-size: 12px; color: #7f91a3; }
      .jl-foot a { color: #9fd6cf; }
      .jl-spinner { width: 18px; height: 18px; border: 2px solid rgba(31,41,55,.25); border-top-color: #1f2937; border-radius: 50%; animation: jl-spin .8s linear infinite; }
      @keyframes jl-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Our sign-in screen. The CMS (Sveltia) loads underneath; its own login button is driven from here. -->
    <div id="jsnm-login" role="dialog" aria-labelledby="jl-title" aria-describedby="jl-desc">
      <div class="jl-card">
        <img class="jl-logo" src="/assets/brand/logo-transparent.webp" alt="" width="160" height="160" />
        <h1 id="jl-title">JS Neurominds Admin</h1>
        <p id="jl-desc">Edit the website — clinic details, pages, conditions, doctors, articles. Sign in with your clinic Google account.</p>
        <button class="jl-google" type="button" id="jl-google" disabled>
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>
          <span id="jl-label">Loading…</span>
        </button>
        <div class="jl-status" id="jl-status" aria-live="polite"></div>
        <div class="jl-foot">Access is limited to approved clinic emails. <a href="https://neurominds.in" rel="noopener">Back to website</a></div>
      </div>
    </div>

    <!-- Sveltia CMS: a modern, open-source, git-based CMS (free). Loads ./config.yml from this folder.
         Every save becomes a commit on GitHub → Cloudflare Pages rebuilds → live in ~2 minutes.
         Pinned version: unpkg serves versioned URLs with a 1-year immutable cache (no redirect hop). Bump deliberately after testing. -->
    <script src="https://unpkg.com/@sveltia/cms@0.253.1/dist/sveltia-cms.js" type="module"></script>
    <script>
      (function () {
        var overlay = document.getElementById('jsnm-login');
        var btn = document.getElementById('jl-google');
        var label = document.getElementById('jl-label');
        var status = document.getElementById('jl-status');
        var GATEWAY = 'https://jsnm-admin-gateway.tcgr-8553665381.workers.dev';
        var hidden = false, busy = false, seenSignIn = false, authOk = false, backAgain = 0;

        // Sveltia keeps the signed-in user in localStorage; a saved session means "skip the screen".
        function hasSession() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (/^sveltia-cms\.user$/.test(k) || (/sveltia/i.test(k) && /user/i.test(k))) {
                var v = localStorage.getItem(k) || '';
                if (/"token"\s*:\s*"[^"]{8,}/.test(v)) return true;
              }
            }
          } catch (ignore) { /* storage blocked */ }
          return false;
        }
        function walk(root, fn) {
          if (!root || !root.querySelectorAll) return false;
          var all = root.querySelectorAll('*');
          for (var i = 0; i < all.length; i++) { if (fn(all[i]) === true) return true; if (all[i].shadowRoot && walk(all[i].shadowRoot, fn)) return true; }
          return false;
        }
        function cmsSignInButton() {
          var found = null;
          walk(document, function (el) {
            if ((el.tagName === 'BUTTON' || el.tagName === 'A') && /sign\s*in/i.test(el.textContent || '') && !overlay.contains(el)) { found = el; return true; }
          });
          return found;
        }
        function cmsErrorText() {
          var txt = '';
          walk(document, function (el) {
            if (el.getAttribute && el.getAttribute('role') === 'alert' && !overlay.contains(el) && (el.textContent || '').trim()) { txt = el.textContent.trim(); return true; }
          });
          return txt;
        }
        function hide() {
          if (hidden) return; hidden = true;
          overlay.classList.add('is-hidden');
          setTimeout(function () { if (hidden) overlay.hidden = true; }, 300);
        }
        function show() {
          if (!hidden) return; hidden = false; authOk = false; busy = false; backAgain = 0;
          overlay.hidden = false; overlay.classList.remove('is-hidden');
          btn.disabled = false; label.textContent = 'Continue with Google'; status.textContent = ''; status.className = 'jl-status';
        }
        function setStatus(txt, isError) {
          if (status.textContent !== txt) { status.textContent = txt; status.className = 'jl-status' + (isError ? ' is-error' : ''); }
        }

        function tick() {
          var signIn = cmsSignInButton();
          if (hidden) {
            // Signed out (Sveltia shows its login again, and no saved session) → bring our screen back.
            // Require it to persist ~1s so a brief flash during auth doesn't re-open the screen.
            backAgain = (signIn && !hasSession()) ? backAgain + 1 : 0;
            if (backAgain >= 3) show();
            return;
          }
          if (signIn) {
            seenSignIn = true;
            if (btn.disabled && !busy) { btn.disabled = false; label.textContent = 'Continue with Google'; }
            var err = cmsErrorText();
            if (err && !/aborted/i.test(err)) setStatus(err, true);
          } else if (authOk || hasSession() || seenSignIn) {
            // Login UI gone after a successful auth / with a saved session → the editor is up.
            hide();
          }
        }

        if (hasSession()) hide(); // returning user: never flash the sign-in screen

        // The gateway popup posts Decap/Sveltia's success message to this window.
        window.addEventListener('message', function (e) {
          if (e.origin !== GATEWAY || typeof e.data !== 'string') return;
          if (e.data.indexOf('authorization:github:success') === 0) { authOk = true; busy = false; setStatus('Signed in — opening the editor…'); setTimeout(tick, 1200); }
          else if (e.data.indexOf('authorization:github:error') === 0) {
            var msg = 'Sign-in failed.'; try { msg = JSON.parse(e.data.replace(/^authorization:github:error:/, '')).message || msg; } catch (ignore) { /* keep default */ }
            busy = false; btn.disabled = false; label.textContent = 'Continue with Google'; setStatus(msg, true);
          }
        });

        var timer = setInterval(tick, 400);
        new MutationObserver(function (records) {
          for (var i = 0; i < records.length; i++) { if (!overlay.contains(records[i].target)) { tick(); return; } }
        }).observe(document.body, { childList: true, subtree: true });
        // Safety: CMS never rendered a sign-in button (e.g. config error) → reveal its screen so the error is visible.
        setTimeout(function () { if (!hidden && !seenSignIn && !cmsSignInButton()) hide(); }, 12000);

        btn.addEventListener('click', function () {
          var signIn = cmsSignInButton();
          if (!signIn) { setStatus('Still loading the editor… please try again in a moment.'); return; }
          setStatus('Opening Google sign-in…');
          busy = true; btn.disabled = true; label.innerHTML = '<span class="jl-spinner" aria-hidden="true"></span>';
          signIn.click(); // same user gesture → the popup is allowed
          setTimeout(function () {
            if (hidden || authOk) return;
            busy = false; btn.disabled = false; label.textContent = 'Continue with Google';
            var e = cmsErrorText(); if (e && !/aborted/i.test(e)) setStatus(e, true); else setStatus('');
          }, 8000);
        });
      })();
    </script>
  </body>
</html>
