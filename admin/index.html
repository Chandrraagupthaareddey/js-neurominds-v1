<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>JS Neurominds — Admin (Content Editor)</title>
    <link rel="icon" href="/assets/brand/favicon-32x32.png" sizes="32x32" type="image/png" />
    <meta name="theme-color" content="#0e1b2a" />
    <meta name="description" content="Content editor for the JS Neurominds website (staff only)." />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://api.github.com" />
    <link rel="modulepreload" href="https://unpkg.com/@sveltia/cms@0.253.1/dist/sveltia-cms.js" />
    <!-- Absolute config path: works at /, /admin/ and any deep link such as /callback -->
    <link rel="cms-config-url" href="config.yml" id="cms-config-link" />
    <script>
      // Resolve config.yml next to THIS page (admin.neurominds.in/config.yml or neurominds.in/admin/config.yml), never relative to a deep path.
      (function(){ var base = location.pathname.indexOf("/admin/") === 0 ? "/admin/" : "/"; document.getElementById("cms-config-link").href = base + "config.yml"; })();
    </script>
    <style>
      /* Shown only until the CMS script loads (or if it cannot). */
      #jsnm-fallback { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 12vh auto; padding: 0 20px; color: #334; }
      #jsnm-fallback h1 { font-size: 20px; margin: 0 0 8px; }
      #jsnm-fallback code { background: #eef; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="jsnm-fallback">
      <h1>JS Neurominds — Admin</h1>
      <p>Loading the content editor… If this message stays, check your internet connection or that <code>config.yml</code> is present next to this page.</p>
    </div>
    <!-- Sveltia CMS: a modern, open-source, git-based CMS (free). Loads ./config.yml from this folder.
         Every save becomes a commit on GitHub → Cloudflare Pages rebuilds → live in ~2 minutes. -->
    <!-- Pinned version: unpkg serves versioned URLs with a 1-year immutable cache (no redirect hop). Bump deliberately after testing. -->
    <script src="https://unpkg.com/@sveltia/cms@0.253.1/dist/sveltia-cms.js" type="module"></script>
    <script>
      // Remove the fallback once the CMS has rendered, and relabel the OAuth button:
      // sign-in goes through the Admin Gateway (Google), not GitHub directly.
      const relabel = () => {
        document.querySelectorAll('button, a').forEach((b) => {
          if (/sign in with github/i.test(b.textContent || '')) b.textContent = 'Sign in with Google';
        });
      };
      new MutationObserver((m, obs) => {
        const f = document.getElementById('jsnm-fallback');
        if (f && document.body.children.length > 2) f.remove();
        relabel();
      }).observe(document.body, { childList: true, subtree: true });
      setTimeout(relabel, 1500);
    </script>
  </body>
</html>
