      - name: faq
        label: FAQ page
        file: content/pages/faq.json
        format: json
        fields:
          - { name: page, widget: hidden, default: faq }
          - *seo_title
          - *seo_description
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }

      - name: lab
        label: Lab Tests page
        file: content/pages/lab.json
        format: json
        fields:
          - { name: page, widget: hidden, default: lab }
          - *seo_title
          - *seo_description
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }
          - { name: assurance_items, label: Assurance strip, widget: list, summary: '{{fields.icon}} {{fields.text}}', fields: [{ name: icon, label: Emoji/icon, widget: string }, { name: text, label: Text, widget: string }] }
          - { name: form_eyebrow, label: Form — small heading, widget: string }
          - { name: form_title, label: Form — heading, widget: string }
          - { name: form_lede, label: Form — intro, widget: text }

      - name: testimonials
        label: Testimonials page
        file: content/pages/testimonials.json
        format: json
        fields:
          - { name: page, widget: hidden, default: testimonials }
