          - { name: hero_eyebrow, label: Hero small heading, widget: string }
          - { name: hero_title, label: Hero headline (use <em>…</em> for the green part), widget: string }
          - { name: hero_lede, label: Hero paragraph, widget: text }
          - { name: hero_cta_label, label: Hero button label, widget: string }
          - { name: trust_items, label: Trust strip (4 items), widget: list, summary: '{{fields.value}} — {{fields.label}}', fields: [{ name: value, label: Big text, widget: string }, { name: label, label: Small text, widget: string }] }
          - { name: assurance_items, label: Assurance strip, widget: list, summary: '{{fields.icon}} {{fields.text}}', fields: [{ name: icon, label: Emoji/icon, widget: string }, { name: text, label: Text, widget: string }] }
          - { name: conditions_eyebrow, label: Conditions — small heading, widget: string }
          - { name: conditions_title, label: Conditions — heading, widget: string }
          - { name: conditions_lede, label: Conditions — intro, widget: text }
          - { name: booking_eyebrow, label: Booking — small heading, widget: string }
          - { name: booking_title, label: Booking — heading, widget: string }
          - { name: booking_lede, label: Booking — intro, widget: text }
          - { name: booking_card_badge, label: Booking card — badge, widget: string }
          - { name: booking_card_title, label: Booking card — title, widget: string }
          - { name: booking_card_text, label: Booking card — text, widget: text }
          - { name: booking_card_cta, label: Booking card — button, widget: string }
          - { name: booking_card_note, label: Booking card — note, widget: string }
          - { name: services_eyebrow, label: Services — small heading, widget: string }
          - { name: services_title, label: Services — heading, widget: string }
          - { name: doctor_eyebrow, label: Doctor — small heading, widget: string }
          - { name: doctor_title, label: Doctor — heading, widget: string }
          - { name: lab_eyebrow, label: Lab section — small heading, widget: string }
          - { name: lab_title, label: Lab section — heading, widget: string }
          - { name: lab_lede, label: Lab section — intro, widget: text }
          - { name: lab_cta, label: Lab section — button, widget: string }
          - { name: lab_card_title, label: Lab card — title, widget: string }
          - { name: lab_card_text, label: Lab card — text, widget: text }
          - { name: final_eyebrow, label: Final CTA — small heading, widget: string }
