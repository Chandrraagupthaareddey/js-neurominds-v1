          - *seo_description
          - { name: banner, label: Red banner text (HTML allowed), widget: text }
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }
          - { name: steps_title, label: Steps heading, widget: string }
          - { name: steps, label: Steps (one per line), widget: list }
          - { name: closing, label: Closing paragraph, widget: text }
          - { name: cta_label, label: Button, widget: string }

