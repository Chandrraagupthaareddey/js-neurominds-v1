          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }
          - { name: disclaimer, label: Disclaimer notice, widget: text }

      - name: treatments
        label: Treatments page
        file: content/pages/treatments.json
        format: json
        fields:
          - { name: page, widget: hidden, default: treatments }
          - *seo_title
          - *seo_description
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }

      - name: services
        label: Services page
        file: content/pages/services.json
        format: json
        fields:
          - { name: page, widget: hidden, default: services }
          - *seo_title
          - *seo_description
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }

      - name: doctors
        label: Doctors page
        file: content/pages/doctors.json
        format: json
        fields:
          - { name: page, widget: hidden, default: doctors }
          - *seo_title
          - *seo_description
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
