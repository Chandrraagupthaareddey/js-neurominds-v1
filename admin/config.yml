# =============================================================================
# JS Neurominds — Admin CMS configuration (Sveltia CMS, git-based, free)
#
# How publishing works:
#   Editor saves in the admin  →  commit to GitHub (main)  →  Cloudflare Pages
#   rebuilds the site (~2 min)  →  change is live on https://neurominds.in
# No database, no server, no Apps Script involved for content.
#
# Sign-in:
#   Default = "Sign in with Token": one-time paste of a GitHub fine-grained
#   personal access token for the clinic's GitHub account (see docs/ADMIN_CMS.md).
#   Zero infrastructure. To switch to the friendlier "Sign in with GitHub"
#   button, deploy the free Sveltia CMS Authenticator Worker and fill in
#   base_url below + set auth_methods: [oauth, token].
# =============================================================================
backend:
  name: github
  repo: Chandrraagupthaareddey/js-neurominds-v1
  branch: main
  auth_methods: [token]
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev
  # auth_methods: [oauth, token]
  commit_messages:
    create: 'Content: create {{collection}} "{{slug}}"'
    update: 'Content: update {{collection}} "{{slug}}"'
    delete: 'Content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'Media: upload "{{path}}"'
    deleteMedia: 'Media: delete "{{path}}"'

# Images uploaded from the admin (doctor photos, article images, logo).
media_folder: public-site/assets/img
public_folder: /assets/img

site_url: https://neurominds.in
display_url: https://neurominds.in
logo_url: https://neurominds.in/assets/brand/logo.png

# Simple workflow: Save = publish (commit). Set to editorial_workflow for a
# draft → review → publish board (uses GitHub pull requests, still free).
publish_mode: simple

# Shared field snippets -------------------------------------------------------
_status: &status
  { name: status, label: Status, widget: select, options: [{ label: Published (visible on site), value: published }, { label: Draft (hidden from site), value: draft }], default: published }
_seo_title: &seo_title
  { name: seo_title, label: SEO title, widget: string, required: false, hint: 'Shown in Google / browser tab. Aim for ≤ 60 characters. Leave blank to use the name.' }
_seo_description: &seo_description
  { name: seo_description, label: SEO description, widget: text, required: false, hint: 'Google snippet. Aim for 120–160 characters.' }

collections:
  # ===========================================================================
  # 1. SITE SETTINGS (single files)
  # ===========================================================================
  - name: settings
    label: Site Settings
    icon: settings
    description: Clinic details, navigation, feature switches, buttons, SEO defaults.
    editor: { preview: false }
    files:
      - name: clinic
        label: Clinic details & header/footer
        file: content/clinic.json
        format: json
        fields:
          - { name: clinic_name, label: Clinic name, widget: string }
          - { name: clinic_short, label: Short name (header logo text), widget: string }
          - { name: tagline, label: Header tagline (under the name), widget: string, required: false }
          - { name: doctor_lead, label: Lead doctor, widget: string, required: false }
          - { name: display_phone, label: Phone (as displayed), widget: string }
          - { name: cta_phone, label: Phone (for call links, with +91), widget: string }
          - { name: call_link, label: Call link, widget: string, hint: 'tel:+91XXXXXXXXXX' }
          - { name: whatsapp_link, label: WhatsApp link, widget: string, hint: 'https://wa.me/91XXXXXXXXXX' }
          - { name: email_support, label: Support email, widget: string, required: false }
          - { name: address, label: Address, widget: text }
          - { name: opening_hours_text, label: Opening hours (display text), widget: string, required: false }
          - { name: maps_url, label: Google Maps link, widget: string }
          - { name: maps_embed_url, label: Google Maps embed URL (optional), widget: string, required: false, hint: 'Maps → Share → Embed a map → copy the src="…" URL only. Leave blank to show a "Open Google Maps" button instead.' }
          - { name: google_review_url, label: Google review link, widget: string, required: false }
          - { name: pwens_booking_url, label: PWeNS booking URL, widget: string }
          - { name: nav_cta_label, label: Header button label, widget: string, required: false, default: Book now }
          - { name: emergency_bar_text, label: Emergency bar text (HTML allowed), widget: text, required: false }
          - { name: footer, label: Footer credit (HTML allowed), widget: string, required: false }
          - { name: logo_url, label: Logo, widget: image, required: false, allow_multiple: false }
          - { name: footer_logo_url, label: Footer logo, widget: image, required: false, allow_multiple: false }
          - { name: social_preview_url, label: Social share image (1200×630), widget: image, required: false, allow_multiple: false }
          - { name: ga4_measurement_id, label: GA4 measurement ID, widget: string, required: false }
          - { name: domain, label: Site domain, widget: string, default: 'https://neurominds.in', hint: 'Used for canonical URLs and the sitemap.' }

      - name: navigation
        label: Navigation menu
        file: content/navigation.json
        format: json
        fields:
          - name: items
            label: Menu items
            widget: list
            summary: '{{fields.label}} → {{fields.route}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: route, label: Route, widget: select, options: ['/', '/about', '/doctors', '/conditions', '/treatments', '/services', '/lab', '/knowledge', '/faq', '/contact', '/testimonials', '/booking', '/emergency'] }
              - { name: order, label: Order, widget: number, value_type: int, default: 1 }
              - { name: is_enabled, label: Show in menu, widget: boolean, default: true }

      - name: feature_flags
        label: Feature switches
        file: content/settings/feature_flags.json
        format: json
        fields:
          - { name: public_lab_tests_enabled, label: Show Lab Tests (page, menu, home section), widget: boolean, default: false }
          - { name: public_callback_enabled, label: Show "Request clinic callback" form on Booking, widget: boolean, default: false }
          - { name: public_testimonials_enabled, label: Show Testimonials, widget: boolean, default: true }
          - { name: public_reviews_enabled, label: Show Google reviews block, widget: boolean, default: true }
          - { name: public_knowledge_enabled, label: Show Knowledge articles, widget: boolean, default: true }
          - { name: public_announcements_enabled, label: Announcements (reserved), widget: boolean, default: false }
          - { name: floating_cta_enabled, label: Show floating Call / WhatsApp / Enquire buttons, widget: boolean, default: true }
          - { name: emergency_bar_enabled, label: Show the red emergency bar, widget: boolean, default: true, required: false }

      - name: floating_cta
        label: Floating buttons (Call / WhatsApp / Enquire)
        file: content/settings/floating_cta.json
        format: json
        fields:
          - name: items
            label: Buttons
            widget: list
            summary: '{{fields.label}} ({{fields.kind}})'
            fields:
              - { name: cta_id, label: ID, widget: string, hint: 'Any short unique id, e.g. fab_call' }
              - { name: kind, label: Type, widget: select, options: [{ label: Call, value: call }, { label: WhatsApp, value: whatsapp }, { label: 'Enquire / feedback form', value: feedback }] }
              - { name: label, label: Label, widget: string }
              - { name: value, label: Link, widget: string, required: false, hint: 'tel:+91… for Call, https://wa.me/91… for WhatsApp, blank for Enquire' }
              - { name: whatsapp_text, label: Pre-filled WhatsApp message, widget: string, required: false }
              - { name: is_enabled, label: Enabled, widget: boolean, default: true }
              - { name: display_order, label: Order, widget: number, value_type: int, default: 1 }
              - { name: device_visibility, label: Show on, widget: select, options: [all, mobile, desktop], default: all }

      - name: social_links
        label: Social links (footer)
        file: content/social_links.json
        format: json
        fields:
          - name: items
            label: Links
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: social_id, label: ID, widget: string }
              - { name: platform, label: Platform (icon), widget: select, options: [instagram, whatsapp, google, youtube, facebook, linkedin] }
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string, required: false }
              - { name: aria_label, label: Accessible label, widget: string, required: false }
              - { name: is_enabled, label: Show, widget: boolean, default: true }
              - { name: open_in_new_tab, label: Open in new tab, widget: boolean, default: true }
              - { name: display_order, label: Order, widget: number, value_type: int, default: 1 }

      - name: google_reviews
        label: Google reviews block
        file: content/settings/google_reviews.json
        format: json
        fields:
          - { name: rating, label: Overall rating, widget: number, value_type: float, min: 1, max: 5, step: 0.1 }
          - { name: review_count, label: Number of reviews, widget: number, value_type: int }
          - { name: profile_url, label: Google profile URL, widget: string }
          - { name: write_review_url, label: "Write a review" URL, widget: string, required: false }
          - name: reviews
            label: Highlighted reviews
            widget: list
            summary: '{{fields.author_display}} — {{fields.rating}}★'
            fields:
              - { name: review_id, label: ID, widget: string }
              - { name: author_display, label: Reviewer name (as shown on Google), widget: string }
              - { name: rating, label: Rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { name: relative_time, label: When (e.g. "a month ago"), widget: string, required: false }
              - { name: text, label: Review text, widget: text }
              - { name: review_url, label: Link to review, widget: string, required: false }
              - { name: status, label: Status, widget: select, options: [approved, pending], default: approved }

      - name: callback_options
        label: Callback form dropdown options
        file: content/settings/callback_options.json
        format: json
        fields:
          - { name: time_slots, label: Preferred time slots, widget: list }
          - { name: consultation_for, label: "Consultation for" options, widget: list }
          - { name: patient_type, label: Patient type options, widget: list }
          - { name: consultation_mode, label: Consultation mode options, widget: list }
          - { name: concern_categories, label: Concern categories, widget: list }

      - name: seo
        label: SEO defaults & verification
        file: content/settings/seo.json
        format: json
        fields:
          - { name: site_name, label: Site name, widget: string }
          - { name: default_title_suffix, label: Default title suffix, widget: string, required: false }
          - { name: default_description, label: Default description, widget: text }
          - { name: social_preview_url, label: Default share image, widget: image, required: false, allow_multiple: false }
          - { name: google_site_verification, label: Google Search Console verification code, widget: string, required: false, hint: 'Only the content="…" value from the meta tag Google gives you.' }
          - { name: bing_site_verification, label: Bing Webmaster verification code, widget: string, required: false }
          - { name: opening_hours, label: Opening hours (schema.org format), widget: list, required: false, hint: 'e.g. Mo-Sa 09:00-20:00' }
          - { name: price_range, label: Price range (e.g. ₹₹), widget: string, required: false }
          - { name: geo_latitude, label: Latitude, widget: string, required: false }
          - { name: geo_longitude, label: Longitude, widget: string, required: false }
          - { name: same_as, label: Official profile URLs (Instagram, Google, etc.), widget: list, required: false }

  # ===========================================================================
  # 2. PAGE TEXT (headings, intros, buttons on each static page)
  # ===========================================================================
