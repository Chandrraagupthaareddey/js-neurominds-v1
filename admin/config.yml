          - { name: cta_label, label: CTA — button, widget: string }

  # ===========================================================================
  # 3. CONTENT COLLECTIONS (one file per entry)
  # ===========================================================================
  - name: conditions
    label: Conditions
    label_singular: Condition
    icon: psychology
    folder: content/conditions
    identifier_field: name
    create: true
    slug: '{{slug}}'
    format: json
    extension: json
    summary: '{{name}} — {{status}}'
    preview_path: 'conditions/{{slug}}'
    sortable_fields: [name, category, status]
    view_filters:
      - { label: Published, field: status, pattern: published }
      - { label: Draft, field: status, pattern: draft }
      - { label: Featured on home, field: is_featured, pattern: true }
    view_groups:
      - { label: Category, field: category }
    fields:
      - { name: condition_id, label: ID, widget: string, required: false, hint: 'Optional internal id, e.g. cond_anxiety' }
      - { name: slug, label: Page URL (slug), widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes only'], hint: 'Becomes neurominds.in/conditions/<slug>. Changing it changes the URL.' }
      - { name: name, label: Name, widget: string }
      - { name: category, label: Category, widget: string, required: false, hint: 'e.g. Anxiety, Mood, Sleep, Child & Teen' }
      - { name: one_line_summary, label: One-line summary, widget: text }
      - { name: symptoms, label: Common signs, widget: list, required: false, hint: 'One per item' }
      - { name: when_to_consult, label: When to consult, widget: text, required: false }
      - { name: treatment_approach, label: How we help, widget: text, required: false }
      - { name: related_conditions, label: Related concerns, widget: list, required: false }
      - { name: faqs, label: FAQs, widget: list, required: false, summary: '{{fields.question}}', fields: [{ name: question, label: Question, widget: string }, { name: answer, label: Answer, widget: text }] }
      - { name: is_emergency, label: Show emergency notice on this page, widget: boolean, default: false }
      - { name: is_featured, label: Feature on home page (first 6 shown), widget: boolean, default: false }
      - *status
      - *seo_title
      - *seo_description

  - name: treatments
    label: Treatments
    label_singular: Treatment
    icon: healing
    folder: content/treatments
    identifier_field: name
    create: true
    slug: '{{slug}}'
    format: json
    extension: json
    summary: '{{name}} — {{status}}'
    preview_path: 'treatments/{{slug}}'
    fields:
      - { name: treatment_id, label: ID, widget: string, required: false }
      - { name: slug, label: Page URL (slug), widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes only'] }
      - { name: name, label: Name, widget: string }
      - { name: one_line_summary, label: One-line summary, widget: text }
      - { name: overview, label: Overview, widget: text, required: false }
      - { name: what_to_expect, label: What to expect, widget: text, required: false }
      - { name: conditions_treated, label: Conditions this helps with, widget: list, required: false }
      - { name: faqs, label: FAQs, widget: list, required: false, summary: '{{fields.question}}', fields: [{ name: question, label: Question, widget: string }, { name: answer, label: Answer, widget: text }] }
      - *status
      - *seo_title
      - *seo_description

  - name: services
    label: Services
    label_singular: Service
    icon: medical_services
    folder: content/services
