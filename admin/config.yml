        format: json
        fields:
          - { name: page, widget: hidden, default: about }
          - *seo_title
          - *seo_description
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }
          - { name: approach_title, label: Section 1 title, widget: string }
          - { name: approach_text, label: Section 1 text, widget: text }
          - { name: offer_title, label: Section 2 title, widget: string }
          - { name: offer_text, label: Section 2 text, widget: text }
          - { name: cta_primary, label: Primary button, widget: string }
          - { name: cta_secondary, label: Secondary button, widget: string }

      - name: booking
        label: Booking page
        file: content/pages/booking.json
        format: json
        fields:
          - { name: page, widget: hidden, default: booking }
          - *seo_title
          - *seo_description
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }
          - { name: card_badge, label: Card badge, widget: string }
          - { name: card_title, label: Card title, widget: string }
          - { name: card_text, label: Card text, widget: text }
          - { name: card_cta, label: Card button, widget: string }
          - { name: card_note, label: Card note, widget: string }
          - { name: sticky_cta, label: Mobile sticky button, widget: string }
          - { name: callback_eyebrow, label: Callback section — small heading, widget: string, required: false }
          - { name: callback_title, label: Callback section — heading, widget: string, required: false }
          - { name: callback_text, label: Callback section — intro, widget: text, required: false }

      - name: contact
