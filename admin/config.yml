          - *seo_title
          - *seo_description
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Heading, widget: string }
          - { name: lede, label: Intro, widget: text }
          - { name: cta_eyebrow, label: CTA — small heading, widget: string }
          - { name: cta_title, label: CTA — heading, widget: string }
          - { name: cta_text, label: CTA — text, widget: string }
