<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Contact | JS Neurominds</title>
  <link rel="icon" href="/assets/brand/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/assets/brand/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/assets/brand/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0e1b2a" />
  <meta name="description" content="Contact JS Neurominds and Diagnostic Center, Chandragiri, Tirupati." />
  <link rel="canonical" href="https://neurominds.in/contact.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">
    <section class="section"><div class="container container--prose">
      <div class="section-head" data-reveal><p class="eyebrow">Get in touch</p><h1>Contact us</h1><p class="lede">We're here to help. Call, message, or visit — whatever feels easiest.</p></div>
      <div class="card" id="contact-card" data-reveal="2" style="box-shadow:var(--shadow-md)"></div>
      <div class="cta-strip" style="margin-top:var(--sp-7)" data-reveal>
        <p class="eyebrow eyebrow--center">Ready to start?</p>
        <h2>Book a confirmed appointment</h2>
        <p>Check live availability and confirm your appointment securely online.</p>
        <a class="btn btn--primary btn--lg" href="/booking.html#confirmed" style="margin-top:var(--sp-4)">Book confirmed appointment</a>
      </div></div></section>
  </main>
  <script type="module">
    import { mountShell } from '/assets/js/app.js';
    import '/assets/js/feedback.js';
    (async () => { await mountShell(); const { renderContact } = await import('/assets/js/static.js'); document.addEventListener('jsnm:shell-ready', (e)=>renderContact(e.detail.cfg)); })();
  </script>
</body>
</html>
